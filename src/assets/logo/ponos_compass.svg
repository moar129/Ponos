<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients for Metallic/3D Effect -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED382" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#7A5200" />
    </linearGradient>

    <radialGradient id="ring-grad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#E2B743" />
      <stop offset="95%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6205" />
    </radialGradient>

    <radialGradient id="dot-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF0B3" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#664600" />
    </radialGradient>

    <!-- Diamond Marker Template -->
    <g id="diamond">
      <polygon points="250,230 255,250 250,270 245,250" fill="url(#gold-light)" />
    </g>

    <!-- 8-Point Star Ray Pair Templates -->
    <!-- Major Point (North) -->
    <g id="major-point">
      <!-- Left (Dark) Side -->
      <polygon points="250,250 250,115 240,250" fill="url(#gold-dark)" />
      <!-- Right (Light) Side -->
      <polygon points="250,250 250,115 260,250" fill="#FDFBF7" opacity="0.9" />
      <polygon points="250,250 250,115 250,250" fill="url(#gold-light)" />
    </g>

    <!-- Medium Point (North-East) -->
    <g id="medium-point">
      <polygon points="250,250 325,175 250,238" fill="url(#gold-dark)" />
      <polygon points="250,250 325,175 262,250" fill="url(#gold-light)" />
    </g>

    <!-- Main Long Pointer (North) -->
    <g id="main-pointer">
      <polygon points="250,250 250,120 243,250" fill="url(#gold-dark)" />
      <polygon points="250,250 250,120 257,250" fill="url(#gold-light)" />
    </g>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="250" cy="250" r="130" fill="none" stroke="url(#ring-grad)" stroke-width="7" />
  <circle cx="250" cy="250" r="133.5" fill="none" stroke="#7A5200" stroke-width="0.75" opacity="0.6" />
  <circle cx="250" cy="250" r="126.5" fill="none" stroke="#FFF0B3" stroke-width="0.75" opacity="0.8" />

  <!-- Outer Directional Dots -->
  <circle cx="250" cy="98" r="6" fill="url(#dot-grad)" />
  <circle cx="250" cy="402" r="6" fill="url(#dot-grad)" />
  <circle cx="98" cy="250" r="6" fill="url(#dot-grad)" />
  <circle cx="402" cy="250" r="6" fill="url(#dot-grad)" />

  <!-- White Inner Star Layer (Underlay/Highlight) -->
  <g id="white-star-bg">
    <path d="M250,250 L250,118 L258,250 L250,382 L242,250 Z" fill="#FAFAFA" />
    <path d="M250,250 L118,250 L250,258 L382,250 L250,242 Z" fill="#FAFAFA" />
  </g>

  <!-- Diagonal Points (NE, SE, SW, NW) -->
  <g id="diagonal-points">
    <!-- NE -->
    <polygon points="250,250 325,175 250,241" fill="url(#gold-dark)" />
    <polygon points="250,250 325,175 259,250" fill="url(#gold-light)" />
    
    <!-- SE -->
    <polygon points="250,250 325,325 259,250" fill="url(#gold-dark)" />
    <polygon points="250,250 325,325 250,259" fill="url(#gold-light)" />
    
    <!-- SW -->
    <polygon points="250,250 175,325 250,259" fill="url(#gold-dark)" />
    <polygon points="250,250 175,325 241,250" fill="url(#gold-light)" />
    
    <!-- NW -->
    <polygon points="250,250 175,175 241,250" fill="url(#gold-dark)" />
    <polygon points="250,250 175,175 250,241" fill="url(#gold-light)" />
  </g>

  <!-- Cardinal Points (N, E, S, W) - Main Overlay -->
  <!-- North -->
  <polygon points="250,250 250,118 242,250" fill="url(#gold-dark)" />
  <polygon points="250,250 250,118 250,250" fill="#FFF" />
  <!-- East -->
  <polygon points="250,250 382,250 250,242" fill="url(#gold-dark)" />
  <polygon points="250,250 382,250 250,250" fill="#FFF" />
  <!-- South -->
  <polygon points="250,250 250,382 258,250" fill="url(#gold-dark)" />
  <polygon points="250,250 250,382 250,250" fill="#FFF" />
  <!-- West -->
  <polygon points="250,250 118,250 250,258" fill="url(#gold-dark)" />
  <polygon points="250,250 118,250 250,250" fill="#FFF" />

  <!-- Primary Gold Pointers with Fine Tips Outer Layer -->
  <!-- North Spear -->
  <polygon points="250,250 250,115 244,250" fill="url(#gold-dark)" />
  <polygon points="250,250 250,115 256,250" fill="url(#gold-light)" />
  
  <!-- South Spear -->
  <polygon points="250,250 250,385 256,250" fill="url(#gold-dark)" />
  <polygon points="250,250 250,385 244,250" fill="url(#gold-light)" />

  <!-- East Spear -->
  <polygon points="250,250 385,250 250,244" fill="url(#gold-dark)" />
  <polygon points="250,250 385,250 250,256" fill="url(#gold-light)" />

  <!-- West Spear -->
  <polygon points="250,250 115,250 250,256" fill="url(#gold-dark)" />
  <polygon points="250,250 115,250 250,244" fill="url(#gold-light)" />

  <!-- Ring Intersection Diamonds -->
  <!-- North Diamond -->
  <polygon points="250,110 256,120 250,130 244,120" fill="url(#gold-light)" stroke="#7A5200" stroke-width="0.5" />
  <!-- South Diamond -->
  <polygon points="250,390 256,380 250,370 244,380" fill="url(#gold-light)" stroke="#7A5200" stroke-width="0.5" />
  <!-- East Diamond -->
  <polygon points="390,250 380,256 370,250 380,244" fill="url(#gold-light)" stroke="#7A5200" stroke-width="0.5" />
  <!-- West Diamond -->
  <polygon points="110,250 120,256 130,250 120,244" fill="url(#gold-light)" stroke="#7A5200" stroke-width="0.5" />

  <!-- Center Pivot Cap -->
  <circle cx="250" cy="250" r="5" fill="url(#dot-grad)" stroke="#5A3D00" stroke-width="0.5" />
</svg>
